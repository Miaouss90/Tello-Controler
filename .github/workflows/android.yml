name: Android CI & Continuous APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Name APK
        if: github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/debug/app-debug.apk Tello-Controler-latest.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Tello-Controler-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish continuous APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: Tello Controler — Latest development build
          prerelease: true
          make_latest: false
          files: Tello-Controler-latest.apk
          body: |
            Automatically updated APK built from the latest successful commit on main.

            **Installation:** download Tello-Controler-latest.apk directly on Android and open it.
            This is a development build intended for iterative Tello hardware testing.
          token: ${{ secrets.GITHUB_TOKEN }}
