name: Android Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle assembleDebug
      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Tello-Controler-${GITHUB_REF_NAME}.apk"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Tello-Controler-${{ github.ref_name }}.apk
          generate_release_notes: true
          name: Tello Controler ${{ github.ref_name }}
          body: |
            Android installable release of Tello Controler.
            
            Download the APK below directly on your Android phone, open it and approve installation from this source if Android asks.
            
            Early releases are experimental. Validate controls and failsafes in a safe setup before flight.
