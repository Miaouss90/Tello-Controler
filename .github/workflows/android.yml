name: Android CI

# push/PR on main → tests + signed APK artifact.
# push on main (i.e. every merge) → automatic GitHub Release v<base>.<n> (n = releases already in that line) with the APK,
# which the app's UPDATE button downloads and installs.
on:
  push:
    branches: [ main ]
    # Documentation-only changes do not publish a new (identical) release.
    paths-ignore: [ '**.md' ]
  pull_request:
    branches: [ main ]
    paths-ignore: [ '**.md' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Compute version
        id: version
        run: |
          base=$(grep '^telloVersionBase=' gradle.properties | cut -d= -f2)
          git fetch --tags --force --quiet
          patch=$(git tag -l "v${base}.*" | wc -l | tr -d ' ')
          echo "version=${base}.${patch}" >> "$GITHUB_OUTPUT"
          echo "TELLO_VERSION_NAME=${base}.${patch}" >> "$GITHUB_ENV"

      - name: Restore release signing key
        env:
          TELLO_KEYSTORE_BASE64: ${{ secrets.TELLO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$TELLO_KEYSTORE_BASE64" ]; then
            echo "$TELLO_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "TELLO_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "::error::TELLO_KEYSTORE_BASE64 secret missing: main builds must be signed with the release key, or in-app updates break."
            exit 1
          else
            echo "::warning::No signing key available; PR APK is debug-signed and cannot update an installed release."
          fi

      - name: Unit tests
        run: gradle testDebugUnitTest

      - name: Build release APK
        env:
          TELLO_KEYSTORE_PASSWORD: ${{ secrets.TELLO_KEYSTORE_PASSWORD }}
          TELLO_KEY_ALIAS: ${{ secrets.TELLO_KEY_ALIAS }}
          TELLO_KEY_PASSWORD: ${{ secrets.TELLO_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Name APK
        run: cp app/build/outputs/apk/release/app-release.apk "Tello-Controler-v${{ steps.version.outputs.version }}.apk"

      - uses: actions/upload-artifact@v6
        with:
          name: Tello-Controler-v${{ steps.version.outputs.version }}
          path: Tello-Controler-v${{ steps.version.outputs.version }}.apk

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: Tello-Controler-v${{ needs.build.outputs.version }}
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Tello Controler v${{ needs.build.outputs.version }}
          files: Tello-Controler-v${{ needs.build.outputs.version }}.apk
          generate_release_notes: true
          make_latest: 'true'
          body: |
            Automatic release of `main`.

            **Update:** in the app, Settings → UPDATE (phone on a Wi-Fi with Internet, not the Tello Wi-Fi).
            **First install:** download the APK below on the phone and open it.

            Experimental software: validate controls and failsafes in a safe setup before flight.
